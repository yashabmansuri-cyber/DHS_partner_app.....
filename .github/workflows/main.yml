name: Build DHS Partner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DHS_Partner_v14_INSTAGRAM_POPUP.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract DHS Partner ZIP
        run: |
          mkdir android-project
          unzip -q DHS_Partner_v14_INSTAGRAM_POPUP.zip -d android-project

      - name: Show project structure
        run: |
          find android-project -maxdepth 3 -type f | head -100

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build DHS Partner APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-APK
          path: android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
